<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;background:#f4f1e9;color:#202923;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f1e9;padding:28px 12px;"><tr><td align="center">
    <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="width:100%;max-width:600px;background:#fff;border-radius:16px;overflow:hidden;">
      <tr><td style="background:#173b32;padding:26px 30px;color:#fff;"><div style="font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#d8bd76;">Noplastiks</div><h1 style="font-size:25px;line-height:1.3;margin:10px 0 0;">New contact message</h1></td></tr>
      <tr><td style="padding:28px 30px;"><p style="margin:0 0 18px;line-height:1.6;">A visitor submitted a message through the contact form.</p><p style="margin:0 0 8px;font-size:14px;"><strong>Name:</strong> {{ name }}</p><p style="margin:0 0 20px;font-size:14px;"><strong>Email:</strong> <a href="mailto:{{ email }}" style="color:#28634f;">{{ email }}</a></p><h2 style="font-size:16px;margin:0 0 9px;">Message</h2><div style="background:#f7f6f2;border-radius:10px;padding:16px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;">{{ message }}</div></td></tr>
      <tr><td style="padding:17px 30px;background:#faf9f6;color:#69736d;font-size:12px;">Noplastiks · Thoughtful goods, made to last.</td></tr>
    </table>
  </td></tr></table>
</body>
</html>
