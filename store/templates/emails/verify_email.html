<!doctype html>
<html lang="en">
<body style="margin:0;background:#f6f3ed;color:#192631;font-family:Arial,sans-serif">
  <main style="max-width:560px;margin:32px auto;padding:36px 28px;background:#fff;border-radius:18px">
    <p style="color:#a27b27;font-weight:bold;letter-spacing:.08em">NOPLASTIKS</p>
    <h1 style="font-size:24px">Verify your email</h1>
    <p>Hello {{ username }},</p>
    <p>Confirm your email address to activate your Noplastiks account.</p>
    <p style="margin:28px 0"><a href="{{ verify_url }}" style="display:inline-block;padding:14px 22px;border-radius:28px;background:#b48a2c;color:#fff;text-decoration:none;font-weight:bold">Verify email</a></p>
    <p style="font-size:13px;color:#68747a">If you did not create this account, you can ignore this email.</p>
  </main>
</body>
</html>
