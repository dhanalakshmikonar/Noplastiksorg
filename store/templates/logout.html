{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Logout | BrainyBoss</title>
    <link rel="icon" type="image/png" href="{% static 'img/brainyboss_logo.png' %}">
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body class="auth-body">

<div class="auth-container">
    <a href="{% url 'home' %}" class="brand-lockup" aria-label="BrainyBoss home">
        <img src="{% static 'img/brainyboss_logo.png' %}" alt="" class="brand-logo-image">
        <span class="brand-name">BrainyBoss</span>
    </a>
    <h2>Are you sure you want to logout?</h2>

    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn-primary">Confirm Logout</button>
    </form>

    <br>
    <a href="{% url 'home' %}" class="btn-secondary">Cancel</a>
</div>

</body>
</html>
